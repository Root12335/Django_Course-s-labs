{% extends 'parent.html' %}
{% block content %}
<h2>All Trainees</h2>
<a href="{% url 'trainee_add' %}">Add Trainee</a>
<ul>
{% for t in trainees %}
<li>
    {{ t.name }}
    <a href="/trainee/{{ t.id }}">View</a>
    <a href="{% url 'trainee_update' pk=t.id %}">Update</a>
    <a href="/trainee/delete/{{ t.id }}">Delete</a>
</li>
{% endfor %}
</ul>
{% endblock %}
