{% extends 'parent.html' %}
{% block content %}
<h2>All Courses</h2>
<a href="{% url 'course_add' %}">Add Course</a>
<ul>
{% for c in courses %}
<li>
    {{ c.name }}
    <a href="{% url 'course_detail' id=c.id %}">View</a>
    <a href="{% url 'course_update' pk=c.id %}">Update</a>
    <a href="{% url 'course_delete' id=c.id %}">Delete</a>
</li>
{% endfor %}
</ul>
{% endblock %}
